name: room-management

x-release-labels: &release-labels
  RELEASE_ID: ${RELEASE_ID:?RELEASE_ID must name the immutable release}
  com.room.release.working_directory: ${RELEASE_WORKING_DIRECTORY:?RELEASE_WORKING_DIRECTORY must identify the immutable release directory}
  com.room.release.current_pointer: ${RELEASE_CURRENT_POINTER:?RELEASE_CURRENT_POINTER must identify the intended current release directory}
  com.room.release.shared_release_id: ${RELEASE_ID:?RELEASE_ID must name the immutable release}
  com.room.release.compose_sha256: ${RELEASE_COMPOSE_SHA256:?RELEASE_COMPOSE_SHA256 must identify the canonical Compose file}
  com.room.release.caddy_sha256: ${RELEASE_CADDY_SHA256:?RELEASE_CADDY_SHA256 must identify the canonical Caddy file}
  com.room.release.migration_completed: ${RELEASE_MIGRATION_COMPLETED:?RELEASE_MIGRATION_COMPLETED must record successful canonical migration}

x-app: &app
  restart: unless-stopped
  environment:
    RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA must name the committed release}
    RELEASE_ID: ${RELEASE_ID:?RELEASE_ID must name the immutable release}
  labels:
    <<: *release-labels
    org.opencontainers.image.revision: ${RELEASE_SHA:?RELEASE_SHA must name the committed release}
  networks:
    - private

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    labels:
      <<: *release-labels
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
      payment-demo:
        condition: service_started
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      PAYMENT_DEMO_DOMAIN: ${PAYMENT_DEMO_DOMAIN:-}
    env_file:
      - path: ${RELEASE_ENV_DIR:?RELEASE_ENV_DIR must identify service environment files}/caddy.env
        required: true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private
      - edge

  web:
    <<: *app
    image: ${WEB_IMAGE:?WEB_IMAGE must name an immutable web image}
    env_file:
      - path: ${RELEASE_ENV_DIR:?RELEASE_ENV_DIR must identify service environment files}/web.env
        required: true
    command: ['node', 'apps/web/.next/standalone/apps/web/server.js']
    environment:
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA must name the committed release}
      RELEASE_ID: ${RELEASE_ID:?RELEASE_ID must name the immutable release}
    expose:
      - '3000'

  payment-demo:
    <<: *app
    image: ${PAYMENT_DEMO_IMAGE:?PAYMENT_DEMO_IMAGE must name an immutable payment-demo image}
    env_file:
      - path: ${RELEASE_ENV_DIR:?RELEASE_ENV_DIR must identify service environment files}/payment-demo.env
        required: true
    command: ['node', 'apps/payment-demo/main.mjs']
    environment:
      PAYMENT_DEMO_HOST: '0.0.0.0'
      PAYMENT_DEMO_PORT: '3090'
      RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA must name the committed release}
      RELEASE_ID: ${RELEASE_ID:?RELEASE_ID must name the immutable release}
    expose:
      - '3090'

  api:
    <<: *app
    image: ${API_IMAGE:?API_IMAGE must name an immutable api image}
    env_file:
      - path: ${RELEASE_ENV_DIR:?RELEASE_ENV_DIR must identify service environment files}/api.env
        required: true
    command: ['node', 'apps/api/dist/apps/api/src/main.js']
    environment:
      API_HOST: '0.0.0.0'
      API_PORT: '3001'
      RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA must name the committed release}
      RELEASE_ID: ${RELEASE_ID:?RELEASE_ID must name the immutable release}
    expose:
      - '3001'
    networks:
      - private
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then((r) => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  worker:
    <<: *app
    image: ${WORKER_IMAGE:?WORKER_IMAGE must name an immutable worker image}
    env_file:
      - path: ${RELEASE_ENV_DIR:?RELEASE_ENV_DIR must identify service environment files}/worker.env
        required: true
    command: ['node', 'apps/worker/dist/src/main.js']
    networks:
      - private
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    <<: *app
    image: ${API_IMAGE:?API_IMAGE must name the immutable api image used for migration}
    env_file:
      - path: ${RELEASE_ENV_DIR:?RELEASE_ENV_DIR must identify service environment files}/migrate.env
        required: true
    command: ['node', 'packages/database/dist/database/scripts/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    labels:
      <<: *release-labels
    env_file:
      - path: ${RELEASE_ENV_DIR:?RELEASE_ENV_DIR must identify service environment files}/postgres.env
        required: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - private

  redis:
    image: redis:8.4.0-alpine
    restart: unless-stopped
    labels:
      <<: *release-labels
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - private

networks:
  edge: {}
  private:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
  postgres_data: {}
  redis_data: {}
